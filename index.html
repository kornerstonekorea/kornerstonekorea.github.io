<style>
  :root { color-scheme:light; --bg:#eef1f5; --card:#ffffff; --ink:#1c2430; --muted:#6b7684; --line:#d9dee5; --accent:#1f4e8c; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme:dark; --bg:#0f1318; --card:#1b2129; --ink:#e6eaf0; --muted:#97a1ad; --line:#2f3844; --accent:#5b8fd6; }
  }
  :root[data-theme="dark"] { color-scheme:dark; --bg:#0f1318; --card:#1b2129; --ink:#e6eaf0; --muted:#97a1ad; --line:#2f3844; --accent:#5b8fd6; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
         font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif;
         display:flex; align-items:center; justify-content:center; padding:16px; }
  .box { width:100%; max-width:520px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:32px; }
  h1 { margin:0 0 4px; font-size:22px; color:var(--accent); }
  .brand { margin:0 0 24px; font-size:13px; color:var(--muted); }
  a.tool { display:flex; align-items:center; gap:14px; padding:14px 16px; border:1px solid var(--line); border-radius:10px;
           color:var(--ink); text-decoration:none; }
  a.tool + a.tool { margin-top:10px; }
  a.tool:hover { border-color:var(--accent); }
  .tool b { display:block; font-size:16px; color:var(--accent); }
  .tool span { font-size:13px; color:var(--muted); }
  .foot { margin-top:20px; font-size:12px; color:var(--muted); text-align:center; }
  /* 화면 테마 메뉴 (⋮ → System / Light / Dark) — 각 툴과 같은 모양 */
  .thcorner { position:fixed; top:16px; right:16px; }
  .thwrap { position:relative; }
  .thbtn { display:grid; place-items:center; width:32px; height:32px; padding:0; border:1px solid transparent; border-radius:6px;
           background:none; color:var(--ink); cursor:pointer; }
  .thbtn:hover, .thbtn[aria-expanded="true"] { border-color:var(--line); background:var(--card); }
  .thmenu { position:absolute; top:calc(100% + 6px); right:0; z-index:50; display:flex; gap:6px; padding:8px;
            background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.18); }
  .thmenu[hidden] { display:none; }
  .thmenu button { display:flex; flex-direction:column; align-items:center; gap:6px; width:76px; padding:10px 4px;
                   border:1px solid transparent; border-radius:8px; background:none; color:var(--ink);
                   font:inherit; font-size:13px; cursor:pointer; }
  .thmenu button:hover { background:color-mix(in srgb, var(--accent) 10%, transparent); }
  .thmenu button.on { background:color-mix(in srgb, var(--accent) 16%, transparent); border-color:var(--accent); color:var(--accent); font-weight:600; }
</style>
<script>
// 화면 테마: 이 사이트(tools.kornerstonekorea.com) 공통 설정 — 여기서 고르면 M.Tool · M2.Tool 에도 그대로 적용
//   tools.theme(공통) + 각 툴이 읽는 mtool.theme · m2tool.theme 에 같은 값을 저장 (화면 설정만, 데이터와 무관)
var THEME_KEYS = ["tools.theme", "mtool.theme", "m2tool.theme"];
(function () { var t = null; try { t = localStorage.getItem("tools.theme"); } catch (_) {}
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); })();
</script>
</head>
<body>
<div class="thcorner">
  <div class="thwrap" id="thWrap">
    <button class="thbtn" id="thBtn" type="button" title="화면 테마" aria-label="화면 테마" aria-haspopup="true" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
    </button>
    <div class="thmenu" id="thMenu" role="menu" hidden>
      <button type="button" data-theme-opt="system" role="menuitemradio"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg>System</button>
      <button type="button" data-theme-opt="light" role="menuitemradio"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Light</button>
      <button type="button" data-theme-opt="dark" role="menuitemradio"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>Dark</button>
    </div>
  </div>
</div>
<main class="box">
  <h1>Tools</h1>
  <p class="brand">한국코너스톤어드바이져 업무 도구</p>
  <a class="tool" href="/mtool/">
    <div><b>M.Tool</b><span>Margin Analysis</span></div>
  </a>
  <a class="tool" href="/m2tool/">
    <div><b>M2.Tool</b><span>Margin Difference Analysis</span></div>
  </a>
</main>
<script>
(function () {
  var wrap = document.getElementById("thWrap"), btn = document.getElementById("thBtn"), menu = document.getElementById("thMenu");
  function get() { try { return localStorage.getItem("tools.theme") || "system"; } catch (_) { return "system"; } }
  function mark(t) { menu.querySelectorAll("[data-theme-opt]").forEach(function (b) { var on = b.getAttribute("data-theme-opt") === t; b.classList.toggle("on", on); b.setAttribute("aria-checked", String(on)); }); }
  function apply(t) {
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme");
    try { THEME_KEYS.forEach(function (k) { t === "system" ? localStorage.removeItem(k) : localStorage.setItem(k, t); }); } catch (_) {}
    mark(t);
  }
  function open(v) { menu.hidden = !v; btn.setAttribute("aria-expanded", String(v)); }
  mark(get());
  btn.addEventListener("click", function (e) { e.stopPropagation(); open(menu.hidden); });
  menu.addEventListener("click", function (e) { var b = e.target.closest("[data-theme-opt]"); if (b) apply(b.getAttribute("data-theme-opt")); });
  document.addEventListener("click", function (e) { if (!menu.hidden && !wrap.contains(e.target)) open(false); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !menu.hidden) { open(false); btn.focus(); } });
  // 다른 탭(툴)에서 테마를 바꾸면 이 화면도 따라감
  window.addEventListener("storage", function (e) { if (e.key === "tools.theme") { var t = e.newValue || "system"; if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); mark(t); } });
})();
</script>
</body>
</html>
